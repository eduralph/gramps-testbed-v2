# pdca.toml — driver configuration for Gramps Testbed v2.
# Read by pdca_harness.config; the only project-specific runtime config.

[project]
name = "Gramps Testbed v2"
default_branch = "main"
# Default §9 sign-off attribution, so `flow`/`signoff` never need a --by. Override
# per-run with --by. (Template renders this from the copier author_name answer.)
author = "Eduard Ralph"

[paths]
bundle_root = "results"
process_dir = "process"
templates_dir = "templates"

# In-driver lane concurrency (docs 09 §parallel lanes). `lanes` is the worker-pool
# size for the UNATTENDED Do+Check band only — Plan, sign-off, publish, and Act stay
# serial. 1 (the default) is the strictly-serial driver. Override for a single run
# with `PDCA_LANES=N` or `--lanes N` on `pdca flow`.
#
# A pool > 1 runs N bundles concurrently in ONE workspace. Each worker is pinned to a
# fixed lane slot 0..N-1 and exposes it to every gate command as `$PDCA_LANE`. A gate
# that backs onto a shared mutable resource (a target checkout it applies/reverts, a
# container, a port, a scratch dir) MUST name that resource by `$PDCA_LANE` so two
# lanes can't collide — e.g. `--name app-l$PDCA_LANE`, a `repo-lane$PDCA_LANE`
# checkout. Bundles in the same lane reuse that lane's resources serially, so you need
# only N copies, not one per bundle. Leave at 1 unless per-lane disk / sign-off
# ergonomics actually bite (then prefer this over N separate workspaces).
#
# Separate terminals instead of one pool: several standalone `pdca flow <id>` processes
# can share this workspace too — each auto-claims a free lane (lockfile under
# `$WORKSPACE/.pdca-lanes/`) or is pinned with `PDCA_LANE=k`, and publish serializes
# across them on a checkout lock. See docs/parallel-lanes.md §0.1 (issue #98).
[driver]
lanes = 6
# Worktree isolation (issue #94). A cycle's Do/Check run in a dedicated git worktree off
# the target's base, so the host's primary checkout is NEVER mutated in place. The harness
# creates/resets it per cycle (per lane slot) and exposes its path as `$PDCA_WORKTREE` —
# the builder edits there (granted access automatically), and gate commands should target
# `$PDCA_WORKTREE` too (see the gate examples below). On by default; best-effort (a target
# that isn't a worktree-capable git checkout falls back to in-place). Set false to disable.
# OFF here: this testbed's Do never mutates the target in place — it emits a patch.diff the
# C4 gate applies inside the engine's own per-version/per-lane verify worktrees (`make
# worktrees`). So the per-cycle #94 worktree is moot and would only contend with the engine's
# management of ../gramps + ../addons-source. Revisit if a leaf ever edits the target directly.
worktree = false
# Wave-based batch sequencing (#wave-model). When `pdca flow` is given several ids it runs
# them as an ordered sequence of dependency waves (computed from each brief's `Depends on`
# / `Conflicts with`): a wave's bundles build in parallel, then its accepted work reaches
# the NEXT wave's base one of two ways.
#   wave_mode = "stack"  (default) — fold each wave's accepted patches onto a run-scoped
#       integration branch the next wave builds on, and open each PR as a stacked PR. This
#       is PUSH-ONLY (a fork has push), keeps the STOP discipline (the harness never merges;
#       you merge the PR stack bottom-up with a merge commit, not squash), and completes a
#       dependent batch in one run. The fork-safe default.
#   wave_mode = "merge"  (own-repo / continuous-delivery ONLY) — `gh pr merge` each
#       non-final wave's PRs so the next wave builds on the genuinely-merged base. Needs
#       MERGE RIGHTS on the base remote (a fork contributor lacks them upstream — keep
#       "stack" there) and relaxes the STOP discipline for the batch. Fail-closed: a
#       non-mergeable PR stops the run.
# STACK here: gramps fixes are contributed as PRs to gramps-project upstream (a fork has
# push but not merge rights), so the fork-safe stacked-PR mode is the only correct choice.
wave_mode = "stack"
# The `gh pr merge` strategy when wave_mode = "merge": "merge" (a merge commit — auditable,
# bisectable; the default), "squash", or "rebase".
merge_method = "merge"
# Optional integration re-gate (#wave-model). After each wave folds (stack mode), run the
# repo-scoped gates over the folded integration tip before the next wave builds on it, so a
# combination that is red though each fix was green ALONE stops the run. Off by default
# (needs your repo-scoped gates); in merge mode the PR's own CI is the merge-boundary check.
regate_between_waves = false
# Act cadence (issue #109). Act is a cross-cycle beat that yields a real delta only once
# enough cycles have frozen to show a pattern, so `pdca flow` auto-runs it only when this
# many cycles have frozen SINCE the last Act review — counted across flow invocations
# (five one-bundle flows trip it on the fifth), not per-run. Below the threshold the flow
# skips Act with a hint; `pdca act log` runs it on demand and `--no-act` always skips.
# Set to 1 to run Act after every completed flow (the prior behaviour).
act_cadence = 5
# Close-disposition fast path (issue #60). A bundle whose brief's `Disposition hint`
# matches one of these close / no-fix classes skips the builder + reviewer model leaves
# (the engine's only token spend) and routes straight to sign-off, where the human
# confirms or overrides the close. It is a HINT, not a gate: reopening to a fix path
# (iterate-to-Do) re-enables the full Do+Check band. Substring-matched, case-insensitive,
# against the disposition value. Retune this list to your tracker's vocabulary; omit it
# to use the built-in default shown here.
# close_dispositions = ["likely-close", "wontfix", "by-design", "duplicate", "not-reproducible", "manual-verification", "upstream", "external"]

[tracker]
system = "mantis"
url = "https://gramps-project.org/bugs"
issue_id_example = "13418"
# Default tracker export the planner reads the issue row from when `flow` is run
# without --from-csv. The planner reads ONLY the row for the issue id (it does not
# scan the testbed repo for issue info). Re-export from Mantis to refresh.
export_csv = "engine/20260529 - Mantis Export.csv"
# Trailer linking a commit/PR to the issue ({id} = the bug id). Trackers differ
# (GitHub/Mantis "Fixes #{id}", Jira "Fixes PROJ-{id}"); "" enforces none. The
# publish step's commit-msg ends with this; the T4 gate (if any) checks it.
# No tracker id yet? Use `pdca publish --no-issue`: it omits the trailer, relaxes
# T4 to a flag, and records the bundle `id_pending` (no magic "#0000" placeholder).
issue_trailer = "Fixes #{id}"
# Issue-URL template ({id} = the bug id) so the publisher HYPERLINKS the Mantis ticket in
# the PR body (a Markdown link on the id), not just a bare number (#266) — a maintainer
# asked for the report to be clickable, not a bare id. "" ⇒ no link (the bare trailer).
issue_url_pattern = "https://gramps-project.org/bugs/view.php?id={id}"
# Notes-fetch (issue #65): a `.format(id=)` tracker-scrape command run before a Plan beat
# to seed a bundle's issue_<id>/notes.json (the planner reads it for the full comment
# thread) — so a seeded id list briefs end-to-end without scraping by hand. $PDCA_BUNDLE is
# the bundle dir; the command MUST write notes.json there itself. Skipped when notes.json
# already exists; a failure is non-fatal (Plan falls back to the CSV / asking the human).
# The gramps Mantis scraper (Playwright/Chrome) writes results/issue_<id>/notes.json.
# `--attach` is the Cloudflare-loop-robust mode: the first per-id call starts Chrome and
# pauses once to clear Cloudflare / log in, and every later id reattaches to that same
# still-running browser — so a multi-id Plan scrapes without re-tripping the CF challenge.
notes_cmd = "./engine/scripts/scrape-mantis.sh --attach {id}"

# Composable Plan-seeding sources (issue #102) — a brief often draws on MORE than the
# ticket (a linked proposal / ADR / spec, a CSV row). Declare one or more providers as
# [[plan.source]]; each contributes context into the bundle's `sources/` dir before the
# Plan beat, and the planner briefs from ALL of them. Each is best-effort (a missing tool
# / file / failing command is non-fatal). Built-in types: github (gh), gitlab (glab), csv,
# file (a path/glob, {id} interpolated), command (the escape hatch — a `.format(id=)` shell
# command run with $PDCA_BUNDLE / $PDCA_SOURCES set; it writes its own output). The legacy
# notes_cmd above still runs alongside these, so they are purely additive — EXCEPT a source
# that sets `role = "tracker"` (issue #132): it IS the tracker thread, writes the canonical
# notes.json itself, and SUPPRESSES notes_cmd, so the issue is sourced once rather than
# fetched/stored twice. `notes_cmd` and a tracker-role plan.source are mutually exclusive.
# Examples (uncomment to use):
# [[plan.source]]
# type = "github"            # gh issue view {id} --json … → sources/github-<id>.json
# # role = "tracker"         # make THIS the tracker fetch (→ notes.json) and drop notes_cmd
# # repo = "owner/repo"      # optional; omit to use gh's default repo
# [[plan.source]]
# type = "file"              # a linked design doc / ADR / proposal / spec
# path = "docs/adr/*{id}*.md"
# [[plan.source]]
# type = "csv"
# path = "path/to/export.csv"
# key = "id"                 # the id column header; omit to copy the whole export
# [[plan.source]]
# type = "command"           # exactly today's notes_cmd, but one of several sources
# cmd = "./engine/scripts/scrape-notes.sh {id}"

# Publish mechanics — `pdca publish` and the flow's publish-on-accept (docs 03 §Check
# closing step). Branch patterns are `{id}` / `{slug}` format strings; the
# repo→checkout map falls back to the sibling convention (`<project>/../<repo-last-
# segment>`) when a repo_spec is unmapped, so most setups need no entries. Gramps
# fixes use the `fix/bug-…` branch convention (INTEGRATION §2).
[publisher]
fix_branch_pattern = "fix/bug-{id}-{slug}"
feature_branch_pattern = "enhancement/{id}-{slug}"
# The remote the new-PR path branches the fix off of (issue #83). A fork branches off
# `upstream` (canonical) and pushes to `origin` (the fork); an own-repo target has only
# `origin`. Defaulted from contribution_model; change it if your remotes differ.
base_remote = "upstream"

[publisher.checkouts]
# "<org/repo>" = "../<checkout-dir>"   # only the exceptions to the sibling default
# (the sibling default already resolves gramps-project/gramps → ../gramps, etc.)

[publisher.repo_aliases]
# Brief "Repo + branch target" shorthand → canonical OWNER/REPO. A brief may name the
# repo loosely ("gramps (core)", "addons-source"); publish takes the first token and
# maps it here so `gh --repo` / the checkout path get a real OWNER/REPO. An explicit
# OWNER/REPO in the brief passes through untouched.
gramps = "gramps-project/gramps"
addons-source = "gramps-project/addons-source"

# The six model leaves (docs 03 §Implementation substrate). mode = "stub" runs
# the offline placeholders (no model/TTY) so the driver works without a model;
# mode = "command" runs `argv` as a subprocess with the leaf's prompt. `interactive
# = true` hands the terminal to the human (a seeded `claude "<prompt>"` REPL, no
# -p); a headless leaf runs autonomously (`claude -p …`) and writes its artifact.
# Set PDCA_LEAVES_MODE=stub to force stubs everywhere (CI / `make` determinism).
#
# Headless leaves — Do builder (writes patch.diff + test + build-notes.md):
[leaves.builder]
mode = "command"
family = "claude"
interactive = false
argv = ["claude", "-p", "--model", "claude-opus-4-8", "--effort", "high", "--agent", "builder", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Bash(git *),Bash(python3 *)"]

# Builder escalation ladder (issue #135) — optional. A bundle that fails Check and
# iterates re-runs the builder; without escalation it re-fails with the same model until
# you discontinue. Declare stronger backends keyed on the attempt number; do_build picks
# the entry with the highest `min_iteration` <= the current attempt (so a hard bundle
# can't loop forever on an underpowered executor). Each entry inherits any field it omits
# from [leaves.builder]. Iterations-to-pass + which backend ran each pass land in the
# bundle's loop-telemetry.json — the go/no-go metric for adopting a cheaper local builder.
# [[leaves.builder_escalation]]
# min_iteration = 2          # 2nd attempt onward → a stronger model
# argv = ["claude", "-p", "--agent", "builder", "--model", "opus", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob"]
# Difficulty-routed builder variants (issue #134) — optional. Route the Do backend per
# bundle from the brief's `Difficulty` field (the planner's blast-radius assessment, #133),
# so a cheap local model handles easy bundles and a stronger one is reserved for the hard
# ~20%. Each entry's `when = {field, substring}` matches a brief field (like a gate target);
# the FIRST match wins, an absent/unknown field falls back to [leaves.builder] (default-open
# — a missing tag never reduces capability), and the escalation ladder above OVERRIDES the
# variant on iterate. SAFETY: calibrate before you narrow — run the would-be-skipped path on
# a sample of low/medium bundles and confirm ~0 NEEDS-HUMAN on "low" before trusting it.
# [[leaves.builder_variant]]
# when = { field = "difficulty", substring = "high" }
# argv = ["claude", "-p", "--agent", "builder", "--model", "opus", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash,Grep,Glob"]
# Check reviewer (advisory, build-notes withheld). Cross-vendor decorrelation is the
# ideal — a DIFFERENT family from the builder (INTEGRATION §4) — so the reviewer is
# OpenAI Codex: an independent second read of the same diff, decorrelated from the claude
# builder. How the harness drives a non-claude reviewer (leaves._run_review_sandboxed):
# it feeds the review prompt on STDIN (codex exec reads it when no positional PROMPT is
# given), exports $PDCA_TARGET for read-grounding the cited path:line (no `--add-dir` —
# that is claude-only), and runs in a temp sandbox holding ONLY the reviewer inputs
# (build-notes.md withheld → independence is mechanical). Hence the flags: `--sandbox
# workspace-write` so codex can WRITE check-review.md into that cwd. workspace-write confines
# WRITES (and network) to the workspace, NOT reads — so codex still READS $PDCA_TARGET outside
# the sandbox to verify every cited path:line. (Verified: in `exec` mode codex grounds on an
# absolute path outside its cwd; a Codex PR review claimed otherwise — #254 — but the read is
# allowed, so no `--add-dir`/extra readable-root is needed.) `--skip-git-repo-check` because
# the sandbox temp dir is not a git repo. Requires the `codex` CLI installed + authed (OPENAI_API_KEY or `codex login`);
# a failure degrades to a §6 NEEDS-HUMAN placeholder, so the cycle still completes.
# SAME-VENDOR FALLBACK if codex is unavailable — restore:
#   family = "claude"
#   argv = ["claude", "-p", "--model", "claude-sonnet-4-6", "--effort", "medium",
#           "--agent", "reviewer", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit"]
# History: Act 2026-06-19 (testbed #149) ran the Sonnet+medium same-vendor fallback for cost
# while codex was off PATH; codex is now installed (codex-cli 0.142.3) → decorrelation restored.
[leaves.reviewer]
mode = "command"
family = "codex"
interactive = false
argv = ["codex", "exec", "--sandbox", "workspace-write", "--skip-git-repo-check"]

# Interactive leaves — the human-in-the-loop touch points (Plan, Sign-off, Publish,
# Act) hand the terminal to a seeded Claude REPL. Claude by design (a model+human
# session), independent of the builder/reviewer family above.
[leaves.planner]
mode = "command"
family = "claude"
interactive = true
# Plan is the highest-leverage beat: a brief defect propagates through Do and is only
# caught (if at all) by a human at T5. So pin the strongest model + raised effort here
# EXPLICITLY (version-controlled) rather than inheriting an un-versioned machine default
# from ~/.claude.json. `--effort xhigh` is the recommended level for agentic/coding work;
# pin it explicitly because a tier's default effort may be lower than xhigh.
# Act 2026-06-08 (issue_8653: under-specified brief) pinned a strong model + xhigh.
# Act 2026-06-10: briefly moved the planner to Fable 5, then reverted to opus-4-8 for
# planning. 2026-06-14: the prior "mechanical leaves stay on default" stance was reversed —
# builder/reviewer (and signoff/publisher/act) are now pinned EXPLICITLY to
# claude-opus-4-8 + `--effort high` too, since an un-versioned ~/.claude default left the
# implementer leaf weaker than the interactive session. Planner keeps `xhigh` (highest leverage).
# Act 2026-06-19 (testbed #149, token-cost tiering): the leaves are the engine's ONLY
# token spend, and uniform opus/high over-provisioned the human-in-the-loop leaves.
# Retiered by leverage: planner stays opus `xhigh` (a thin brief poisons Do+Check) and
# builder stays opus `high` (writes the patch) — UNCHANGED. reviewer→Sonnet/medium,
# signoff→Sonnet/medium, publisher→Haiku/low (mechanical commit-msg+PR prose),
# act→Sonnet/medium. See process/act-log.md 2026-06-19. Reverse if sign-off/review
# quality regresses over the next K cycles.
argv = ["claude", "--model", "claude-opus-4-8", "--effort", "xhigh", "--agent", "planner", "--permission-mode", "acceptEdits"]

[leaves.signoff]
mode = "command"
family = "claude"
interactive = true
argv = ["claude", "--model", "claude-sonnet-4-6", "--effort", "medium", "--agent", "signoff", "--permission-mode", "acceptEdits"]

# Publisher — the closing work of Check: for an ACCEPTED fix, drafts commit-msg.txt +
# pr-description.md WITH the human (doc 16). The deterministic `pdca publish` then
# branches/applies/commits/pushes and opens the DRAFT PR; this leaf writes prose only.
# Haiku/low (testbed #149): the leaf drafts prose only; the mechanics stay deterministic.
[leaves.publisher]
mode = "command"
family = "claude"
interactive = true
argv = ["claude", "--model", "claude-haiku-4-5-20251001", "--effort", "low", "--agent", "publisher", "--permission-mode", "acceptEdits"]

[leaves.act]
mode = "command"
family = "claude"
interactive = true
argv = ["claude", "--model", "claude-sonnet-4-6", "--effort", "medium", "--agent", "act", "--permission-mode", "acceptEdits"]

# FAMILY PROFILES (vendor neutrality, template v0.46.0). Vendor-CLI behavior is DATA
# (pdca_harness.families): built-ins for claude / codex / gemini / generic; unknown
# families fall back to generic (stdin prompt, no vendor flags), and a non-claude
# BUILDER automatically gets the driver's `gh` PATH-shim STOP guard (same rules as
# claude's PreToolUse hook). Override/extend per instance, e.g.:
# [families.mycli]
# grounding_flag = "--include-directories"   # "" => env-only ($PDCA_TARGET/$PDCA_WORKTREE)
# role_injection = "inline"                  # "flag" | "inline" | "none"
# Any leaf may also carry `agent` / `model` / `effort`, mapped through its family's
# profile (explicit argv always wins) — see the template pdca.toml for details.

# Doctor rows (`pdca doctor`): this instance's engine/workspace prerequisites, as
# data. Config-derived checks (leaf CLIs + auth, gh, bundle root, notes_cmd, python/
# ensurepip/make/git) come for free; these add the Gramps-specific needs. scripts/
# doctor.sh is a thin shim over `pdca doctor`, so `make doctor` and `pdca doctor`
# report the same thing. `cmd` runs from the repo root; per_lane rows expand over
# [driver].lanes ({lane}/{lanes}); level="WARN" = optional (non-fatal).

# -- engine (Docker) --
[[doctor.checks]]
group = "engine"
id = "docker daemon"
cmd = "docker info >/dev/null 2>&1"
hint = "https://docs.docker.com/engine/install/ubuntu/ — all real gates run in a container; if installed: sudo usermod -aG docker $USER (re-login)"
[[doctor.checks]]
group = "engine"
id = "engine image gramps-testbed:ubuntu-<ver>"
cmd = "docker image inspect gramps-testbed:ubuntu-$(python3 engine/scripts/lib/gramps_version.py ../gramps-6.1 2>/dev/null) >/dev/null 2>&1"
hint = "make preflight NO_CAPTURE=1"
level = "WARN"

# -- workspace: sibling checkouts --
[[doctor.checks]]
group = "workspace"
id = "sibling ../gramps (upstream remote)"
cmd = "git -C ../gramps remote get-url upstream >/dev/null 2>&1"
hint = "./engine/scripts/bootstrap-forks.sh"
[[doctor.checks]]
group = "workspace"
id = "sibling ../addons-source (upstream remote)"
cmd = "git -C ../addons-source remote get-url upstream >/dev/null 2>&1"
hint = "./engine/scripts/bootstrap-forks.sh"
[[doctor.checks]]
group = "workspace"
id = "sibling ../addons"
cmd = "test -e ../addons/.git"
hint = "./engine/scripts/bootstrap-forks.sh"

# -- workspace: per-version validation worktrees --
[[doctor.checks]]
group = "workspace"
id = "base worktrees gramps-6.{0,1} + addons-source-6.{0,1}"
cmd = "test -e ../gramps-6.0/.git && test -e ../gramps-6.1/.git && test -e ../addons-source-6.0/.git && test -e ../addons-source-6.1/.git"
hint = "make worktrees   (or the full: make preflight)"
level = "WARN"

# -- workspace: per-LANE worktrees (a batch flow fans out across [driver].lanes) --
[[doctor.checks]]
group = "workspace"
id = "lane worktrees lane{lane} (gramps + addons-source 6.{0,1})"
cmd = "test -e ../gramps-6.0-lane{lane}/.git && test -e ../gramps-6.1-lane{lane}/.git && test -e ../addons-source-6.0-lane{lane}/.git && test -e ../addons-source-6.1-lane{lane}/.git"
hint = "make worktrees LANES={lanes}"
per_lane = true
level = "WARN"

# -- scraper (optional; Mantis thread scraping only) --
[[doctor.checks]]
group = "scraper (optional)"
id = "system Chrome/Chromium"
cmd = "command -v google-chrome google-chrome-stable chromium chromium-browser >/dev/null 2>&1"
hint = "install the Chrome .deb (not the snap) — only for Mantis scraping"
level = "WARN"
[[doctor.checks]]
group = "scraper (optional)"
id = ".venv-mantis (playwright)"
cmd = ".venv-mantis/bin/python -m playwright --version >/dev/null 2>&1"
hint = "./engine/scripts/scrape-mantis.sh --setup"
level = "WARN"

# Optional advisory reviewer leaves (issue #64) — an OPEN list. The `reviewer` leaf above
# judges fix ADEQUACY (causal adequacy, scope, validation); add role-distinct ADVISORY
# reviewers here for other lenses (e.g. correctness bugs the patch introduces + reuse /
# simplification / efficiency cleanups). Each writes check-advisory-<id>.md; its
# `- NEEDS-HUMAN —` findings route into SUMMARY §6. Always advisory — never gates.
# Decorrelate: prefer a `family` distinct from the builder AND the reviewer where you can.
# `when = { field = "<brief field>", substring = "<v>" }` runs it only when that brief
# field matches (e.g. a "Review depth" field an Act rule tunes) — omit to always run.
# [[leaves.advisory]]
# id = "code-review"
# role = "correctness bugs introduced by the patch + reuse/simplification/efficiency cleanups"
# mode = "stub"
# family = "claude"
# argv = ["claude", "-p", "--agent", "code-review", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Bash,Grep,Glob"]
# when = { field = "review depth", substring = "deep" }

# LIVE: an ADVERSARIAL reviewer (issue #151) — a refutation pass that tries to REFUTE the
# red→green evidence AND the reviewer's verdict (defaults to "refuted" when uncertain),
# gated to the highest blast-radius bundles via the Difficulty signal so its cost lands where
# it matters. Decorrelation: the reviewer is `codex` and the builder is `claude` (opus), so
# `claude` here is the available third lens (a distinct agent/role). Advisory — never gates;
# writes check-advisory-adversary.md, its `- NEEDS-HUMAN —` findings route into SUMMARY §6.
[[leaves.advisory]]
id = "adversary"
role = "refute the red→green evidence and the reviewer's verdict; find the input that breaks the fix"
mode = "command"
family = "claude"
argv = ["claude", "-p", "--agent", "adversary", "--permission-mode", "acceptEdits", "--allowedTools", "Read,Bash,Grep,Glob"]
when = { field = "difficulty", substring = "high" }

# Deterministic Check gates (docs 04). Each check runs a shell command; it PASSES
# iff the command exits 0. `scope = "repo"` runs against the working tree (and is
# what CI re-runs via `pdca gates --working-tree`); `scope = "bundle"` needs the
# bundle/patch context ($PDCA_BUNDLE is exported) and runs only locally. The
# SAME commands run for the local driver and CI — single-sourced, no drift.
# With worktree isolation on ([driver].worktree), $PDCA_WORKTREE is also exported —
# the isolated tree Do edited; a bundle-scoped gate should test THAT, not the host
# checkout (e.g. `cd "$PDCA_WORKTREE" && <run the test>`).
#
# The REAL gramps gate tiers (verified commands from the gramps-testbed reference
# repo, see docs/INTEGRATION.md §4). The gramps verification engine lives under
# `engine/` here (the reference repo's `agent-work/scripts/` + top-level `docker/`
# were consolidated into one namespace on integration). As soon as ONE real
# `[[gates.checks]]` row is active, `config.gates_checks` is non-empty and the
# driver stops using its built-in all-PASS stubs — so the rows below are the live
# gate set, not a fallback.
#
# LIVE: C4-verify (per-fix red→green, GATING) + T3-unit (whole-suite, advisory).
# STAGED (commented): T1/T2 static analysis and addon-unit. The same cmd runs both
# places (single-sourced via `pdca gates` / `pdca gates --working-tree`, no drift).

# Target-aware gate selection (template v0.12.0). The repo-scoped runtime gates below
# carry `target` so an addon-only bundle skips the gramps CORE suites (T3-unit,
# T3-interface) and a core-only bundle skips the ADDON matrix (T3-addon-unit-6{0,1}).
# The bundle is classified from its brief's "Repo + branch target": anything mentioning
# `addons-source` → "addon", else the default "core". `pdca gates --working-tree` (no
# bundle) is never filtered, so the CI re-gate is unaffected.
[gates]
target_default = "core"

[gates.target_match]
addon = "addons-source"

# Additive flag (template v0.13.0): a change "surfaces" in the GUI iff the brief's
# `Surfaces` field mentions "gui". A frontend-interacting change (core OR addon) gets
# the `frontend` label, so the GUI smoke (target = "frontend") and the addon-in-GUI E2E
# (target = ["addon", "frontend"]) run for it; a pure-logic change does not.
[gates.target_flags]
frontend = { field = "surfaces", substring = "gui" }

# C4 — the per-fix CORRECTNESS gate (bundle-scoped, GATING). Applies the bundle's
# patch.diff and runs ONLY its test, asserting red-without-fix / green-with-fix.
# This is what makes a bugfix cycle mean something — it actually validates THIS
# change, unlike T3-unit below.
[[gates.checks]]
id = "C4-verify"
tier = "C4"
label = "fix verified: test red pre-fix, green post-fix"
cmd = "./engine/scripts/ubuntu/run-verify.sh"
gating = true
scope = "bundle"

# C4-verify-interface — the per-fix BEHAVIORAL correctness gate (bundle-scoped, ADVISORY
# first; #157). The GUI sibling of C4-verify: instead of the patch's own unit test it runs
# the bug's committed AT-SPI/dogtail repro (engine/interface/test_bug_<id>_*.py), RED on the
# UNPATCHED worktree (bug reproduces → fails) and GREEN on the PATCHED one. The repro is NOT
# in patch.diff (it lives in the testbed mount), so red↔green is just patch-applied-vs-not.
# Runs for any GUI-surfacing change (core OR frontend addon E2E). No repro for the bundle id
# → PDCA-UNVERIFIABLE (human verifies the GUI at sign-off). gating=false until stable
# (a GUI repro is flakier than a unit test); promote like T3-interface once green-baseline.
[[gates.checks]]
id = "C4-verify-interface"
tier = "C4"
label = "fix verified in GUI: interface repro red unpatched, green patched (headless dogtail)"
cmd = "./engine/scripts/ubuntu/run-verify-interface.sh"
gating = false
scope = "bundle"
target = "frontend"   # GUI-surfacing changes only (Surfaces: gui); skips pure-logic fixes

# T3 runtime — the WHOLE gramps core unit suite, on the UNMODIFIED tree. CORE_VERSION
# pins it to the realigned per-version worktree (gramps-6.1), the contribution target,
# NOT the primary ../gramps dev clone — so the baseline diff is against a deterministic
# upstream tree kept current by `make preflight` (the recorded baseline_tree SHA stays
# valid; t3_baseline warns on drift). Advisory (gating = false): on a checkout with any
# pre-existing failure it is red as a baseline and never sees the bundle's patch, so it
# cannot gate a single fix — C4-verify above is the per-fix gate. Re-gate this once the
# suite is green-baseline. Wrapped in t3_baseline.py: it runs the suite, then diffs the
# result against the recorded baseline (engine/baselines/run-unit.json) — a matching
# baseline exits 0 ("known reds"), only a NEW failure exits 1, so only a delta raises §6.
[[gates.checks]]
id = "T3-unit"
tier = "T3"
label = "runtime: gramps core unit suite (whole-suite baseline)"
cmd = "CORE_VERSION=6.1 python3 ./engine/conformance/t3_baseline.py ./engine/scripts/ubuntu/run-unit.sh"
gating = false
scope = "repo"
target = "core"   # gramps core suite — skip on an addon-only bundle

# T3 runtime — the addon unit suites, as a VERSION MATRIX. Addons live on
# addons-source maintenance/gramps6{0,1}; a gramps60 fix is cherry-picked forward to
# gramps61, so each branch's addons must pass against its MATCHING core. Each row
# runs the suite in the pinned per-version worktrees (`make worktrees`) via
# CORE_VERSION, baseline-diffed against its own manifest. Advisory like T3-unit.
[[gates.checks]]
id = "T3-addon-unit-60"
tier = "T3"
label = "runtime: addon suites — addons-source gramps60 × core 6.0 (matrix)"
cmd = "CORE_VERSION=6.0 PDCA_T3_BASELINE=engine/baselines/run-addon-unit-60.json python3 ./engine/conformance/t3_baseline.py ./engine/scripts/ubuntu/run-addon-unit.sh"
gating = false
scope = "repo"
target = "addon"   # addon matrix — skip on a core-only bundle

[[gates.checks]]
id = "T3-addon-unit-61"
tier = "T3"
label = "runtime: addon suites — addons-source gramps61 × core 6.1 (matrix)"
cmd = "CORE_VERSION=6.1 PDCA_T3_BASELINE=engine/baselines/run-addon-unit-61.json python3 ./engine/conformance/t3_baseline.py ./engine/scripts/ubuntu/run-addon-unit.sh"
gating = false
scope = "repo"
target = "addon"   # addon matrix — skip on a core-only bundle

# T3 runtime — interface SMOKE baseline (GUI comes up + opens a tree, driven
# headless via Xvfb + AT-SPI + dogtail; engine/interface/test_smoke.py). Advisory
# and scoped to the smoke test only: the full interface suite is a mix of green
# tests and reproductions of UNMERGED upstream bugs (e.g. bug 14100 / gramps#2322),
# so the whole-suite run is a characterization, not a clean gate — run it manually
# with `./engine/scripts/ubuntu/run-interface.sh` (no arg). A per-fix interface-level
# C4 (bundle-scoped, the bug's own interface test red→green) is the future extension.
[[gates.checks]]
id = "T3-interface"
tier = "T3"
label = "runtime: GUI interface smoke (launch + open tree, headless dogtail)"
cmd = "CORE_VERSION=6.1 python3 ./engine/conformance/t3_baseline.py ./engine/scripts/ubuntu/run-interface.sh test_smoke.py"
gating = false
scope = "repo"
target = "frontend"   # runs for any GUI-surfacing change (core OR addon); skips pure-logic

# T3 runtime — addon END-TO-END: install a frontend addon into a headless gramps GUI and
# run the addon's own tests/interface/ suite (the E2E-with-core a GUI addon needs). Runs
# ONLY for a frontend addon bundle (target subset {addon, frontend}); auto-discovers every
# addon shipping tests/interface/. Advisory + baseline-diffed like the other T3 gates; the
# addon-side test convention is in docs/INTEGRATION.md §3.
[[gates.checks]]
id = "T3-addon-interface"
tier = "T3"
label = "runtime: addon E2E (addon loaded in headless gramps GUI, dogtail)"
cmd = "python3 ./engine/conformance/t3_baseline.py ./engine/scripts/ubuntu/run-addon-interface.sh"
gating = false
scope = "repo"
target = ["addon", "frontend"]   # frontend addons only (AND); pure-logic addons + core skip

# T1/T2/T4 conformance — the structure / shape / contribution tiers, mechanised
# from wiki doc 16, the foundation of the T1–T4 ladder. Each checker cites every
# rule back to its source by SECTION (core vs addon per target; see
# engine/conformance/{doc16,t1_structure,t2_shape,t4_contribution}.py). They are
# bundle-scoped — the dispatcher derives the target from the bundle: T1/T2 audit
# the addon(s) the patch.diff touches (core-only patch = N/A), T4 the bundle's
# commit-msg.txt / pr-description.md (absent = N/A). ADVISORY (gating = false),
# like the T3 baselines: they audit the touched contribution and surface doc-16
# violations as evidence for the reviewer + human, without gating on legacy
# addon state that the contribution did not introduce. Promote to gating once
# the targeted addons are conformance-clean.
#
# EXCEPTION — T2-potfiles is GATING (below). The POTFILES-registration MUST
# (doc 16 §Adding and removing Python files) is contribution-scoped: it inspects only
# the .py files THIS patch adds/removes, never the legacy tree, so it cannot false-fail
# on pre-existing unregistered files. That removes the reason the others stay advisory,
# so the core MUST blocks (a maintainer caught this omission at review — Act 2026-06-12).
[[gates.checks]]
id = "T1-structure"
tier = "T1"
label = "structure: addon layout vs doc 16 §Structure (folder==id, target_version, fname, no __init__.py)"
cmd = "python3 ./engine/conformance/gate.py T1"
gating = false
scope = "bundle"
promote_after = 10   # `pdca gates --promotions` flags it once clean 10 frozen cycles (#156)

[[gates.checks]]
id = "T2-shape"
tier = "T2"
label = "shape: code shape vs doc 16 §Coding style (GPL header on touched files; print() advisory for reviewer)"
cmd = "python3 ./engine/conformance/gate.py T2"
gating = false
scope = "bundle"
promote_after = 10   # `pdca gates --promotions` flags it once clean 10 frozen cycles (#156)

# T2-potfiles — the §Adding and removing Python files MUST, GATING (the exception to the
# advisory posture above). For a CORE bundle whose patch.diff ADDS or REMOVES a .py, that
# file must be registered in po/POTFILES.in (translatable) or po/POTFILES.skip (none), and
# a deletion removed from both. Read from the patch (a new file isn't on disk yet).
# Contribution-scoped → no legacy false-positives → safe to block. target=core skips it for
# addon-only bundles; a core bundle that adds/removes no .py is N/A (pass).
[[gates.checks]]
id = "T2-potfiles"
tier = "T2"
label = "potfiles: new/removed core .py registered in po/POTFILES.in|.skip (doc 16 §Adding and removing Python files)"
cmd = "python3 ./engine/conformance/gate.py T2-potfiles"
gating = true
scope = "bundle"
target = "core"

[[gates.checks]]
id = "T4-contribution"
tier = "T4"
label = "contribution: commit/PR wrapper vs doc 16 §Commit messages + §Contributor workflow"
cmd = "python3 ./engine/conformance/gate.py T4"
gating = false
scope = "bundle"
promote_after = 10   # advisory; `pdca gates --promotions` flags it once clean 10 frozen cycles (#156)

# C5 — the patch's shipped test exercises PRODUCTION, not a hand-ported copy (issue #154).
# Asserts each added test file in the patch.diff imports the production package (gramps core).
# A core-only heuristic: an addon bundle (its test imports the addon's package, not `gramps`)
# self-declares UNVERIFIABLE → SUMMARY §6, never a false fail. Advisory.
[[gates.checks]]
id = "C5-prod-path"
tier = "C5"
label = "test exercises the production path (not a copy)"
cmd = "PDCA_PROD_PACKAGE=gramps python3 scripts/checks/test_exercises_production.py"
gating = false
scope = "bundle"

# T2-lint — the two STATIC-ANALYSIS gates upstream Gramps CI enforces but the
# behavioural (C4/T3) and shape (T2) gates above do NOT: black formatting
# (.github/workflows/black.yml → `psf/black@stable` = `black --check --diff .`)
# and mypy typing (.github/workflows/gramps-ci.yml → `mypy`, reading the repo's
# mypy.ini). A patch can pass C4 red→green and the T3 suite yet still trip these,
# opening an upstream PR that fails CI — so this GATES: a lint-dirty bundle never
# reaches a clean COMPLETE. run-lint.sh applies patch.diff to the pinned upstream
# worktree in the same Docker image and runs black (on the patch's .py) + mypy
# (whole-tree); it self-declares UNVERIFIABLE (§6) when the patch has no core .py
# (addon / prose / manifest-only). Bundle-scoped, core-only (mypy.ini + black
# defaults are the core repo's); publish re-runs it as a pre-push guard.
[[gates.checks]]
id = "T2-lint"
tier = "T2"
label = "black + mypy clean (upstream CI parity)"
cmd = "CORE_VERSION=6.1 ./engine/scripts/ubuntu/run-lint.sh"
gating = true
scope = "bundle"
target = "core"

# --- STAGED (not yet ported / wired) -----------------------------------------
# An interface-level C4 via run-interface.sh lands here once that runner is
# ported (C4-verify is LIVE above — the unit-level per-fix gate); T2-shape covers
# the static-MUST subset of §Coding style, T2-lint the black/mypy gates above.

